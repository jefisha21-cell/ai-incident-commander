<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI Commander — Dashboard</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
</head>
<body>
<div class="layout">

  <aside class="sidebar">
    <div class="sidebar-brand">
      <div class="brand-icon">🛡️</div>
      <h1>AI Incident<br>Commander</h1>
    </div>
    <nav>
      <div class="nav-label">Navigation</div>
      <a href="/"><span class="nav-icon">📤</span> Upload Data</a>
      <a class="active" href="/dashboard"><span class="nav-icon">📊</span> Dashboard</a>
      <a href="/action"><span class="nav-icon">⚡</span> Action Center</a>
    </nav>
    <div class="sidebar-footer">
      <span class="status-dot"></span>Systems Online
    </div>
  </aside>

  <main class="main-content">

    <header class="topbar">
      <div class="topbar-left">
        <h2>Incident Dashboard</h2>
        <div class="metric-chips" id="metricChips" style="margin-top:8px;"></div>
      </div>
      <div class="topbar-right">
        <div class="greeting-badge" id="greeting"></div>
        <button id="themeToggle" class="btn theme-toggle">☀️ Light</button>
      </div>
    </header>

    <!-- Charts -->
    <div class="charts-grid">
      <div class="card" style="margin-bottom:0;">
        <div class="card-header">
          <h3>Risk Score Distribution</h3>
          <span class="card-badge">Bar Chart</span>
        </div>
        <div class="chart-wrap">
          <canvas id="riskBarChart"></canvas>
        </div>
      </div>
      <div class="card" style="margin-bottom:0;">
        <div class="card-header">
          <h3>Incident Type Breakdown</h3>
          <span class="card-badge">Pie Chart</span>
        </div>
        <div class="chart-wrap" style="display:flex;align-items:center;justify-content:center;">
          <canvas id="typePieChart" style="max-height:260px;max-width:260px;"></canvas>
        </div>
      </div>
    </div>

    <!-- Confidence trend -->
    <div class="card" style="margin-top:24px;">
      <div class="card-header">
        <h3>Confidence Score per Incident</h3>
        <span class="card-badge">Line Chart</span>
      </div>
      <div class="chart-wrap">
        <canvas id="confidenceLineChart"></canvas>
      </div>
    </div>

    <!-- Incidents -->
    <div style="margin-top:24px;">
      <div class="section-header">
        <h3>Top Priority Incidents</h3>
        <div class="filter-pills">
          <button class="pill active" data-filter="all">All</button>
          <button class="pill" data-filter="high">🔴 High</button>
          <button class="pill" data-filter="medium">🟡 Medium</button>
          <button class="pill" data-filter="low">🟢 Low</button>
        </div>
      </div>
      <div id="incidentCards" class="incident-grid"></div>
    </div>

  </main>
</div>
<script src="{{ url_for('static', filename='script.js') }}"></script>
</body>
</html>
